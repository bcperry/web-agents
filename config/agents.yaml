      #     - --db-path
      #     - ./data/faa.db
      #   description: "Local SQLite database for FAA data"
    starters:
      - label: What tools do you have?
        message: What data tools are available to you?
      - label: Search drone documentation
        message: Can you search the drone documentation for information about drones and return a picture of a gray eagle?
    system_prompt: |
