# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: web-agents
metadata:
  template: web-agents@0.0.1-beta

services:
  web:
    project: .
    language: python
    host: appservice
    hooks:
      prepackage:
        shell: sh
        run: cd frontend && npm install && npm run build

infra:
  provider: terraform
  path: infra
  parameters:
    environment_name: ${AZURE_ENV_NAME}
    location: ${AZURE_LOCATION}
    existing_resource_group_name: ${EXISTING_RESOURCE_GROUP_NAME}
    azure_openai_api_version: ${AZURE_OPENAI_API_VERSION}
    azure_sql_connectionstring: ${AZURE_SQL_CONNECTIONSTRING}
    sap_emulator_enabled: ${SAP_EMULATOR_ENABLED}
    sap_emulator_sql_server_name: ${SAP_EMULATOR_SQL_SERVER_NAME}
    sap_emulator_database_sku: ${SAP_EMULATOR_DATABASE_SKU}
    sap_emulator_admin_object_id: ${SAP_EMULATOR_ADMIN_OBJECT_ID}
    sap_emulator_admin_login: ${SAP_EMULATOR_ADMIN_LOGIN}
    sap_emulator_public_network_access_enabled: ${SAP_EMULATOR_PUBLIC_NETWORK_ACCESS_ENABLED}
    sap_emulator_allowed_ip_start: ${SAP_EMULATOR_ALLOWED_IP_START}
    sap_emulator_allowed_ip_end: ${SAP_EMULATOR_ALLOWED_IP_END}
    sap_emulator_app_outbound_ips: ${SAP_EMULATOR_APP_OUTBOUND_IPS}
    sap_emulator_entitled_group_ids: ${SAP_EMULATOR_ENTITLED_GROUP_IDS}
    search_service_endpoint: ${SEARCH_SERVICE_ENDPOINT}
    search_index_name: ${SEARCH_INDEX_NAME}
    search_service_resource_id: ${SEARCH_SERVICE_RESOURCE_ID}
    autonomous_scheduler_enabled: ${AUTONOMOUS_SCHEDULER_ENABLED}
    entra_tenant_id: ${OAUTH_AZURE_GOV_AD_TENANT_ID}
    entra_client_id: ${OAUTH_AZURE_GOV_AD_CLIENT_ID}
    entra_client_secret: ${ENTRA_CLIENT_SECRET}
    classification_banner: ${CLASSIFICATION_BANNER}
    app_name: ${APP_NAME}
    app_tagline: ${APP_TAGLINE}
    app_logo: ${APP_LOGO}
    