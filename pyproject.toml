[project]
name = "web-agents"
version = "0.1.0"
description = "AI agent framework with Azure OpenAI"
readme = "README.md"
requires-python = "==3.12.6"
dependencies = [
    "agent-framework-azure-ai-search>=1.0.0b260311",
    "agent-framework-core>=1.0.0",
    "aiohttp>=3.13.5",
    "azure-identity>=1.26.0b2",
    "mcp>=1.27.0,<2",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "agent-framework-openai>=1.0.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "python-dotenv>=1.2.2",
    "azure-search-documents>=11.7.0b2",
    "msal>=1.36.0",
    "agent-framework-azure-cosmos>=1.0.0b260521",
    "httpx>=0.27.0",
    "croniter>=2.0.0",
    "sqlglot>=30.15.0",
    "pyodbc>=5.2.0",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5,<3.2",
    "playwright>=1.58.0",
    "pytest>=9.0.2",
]

[tool.uv]
default-groups = []
prerelease = "allow"

[tool.pytest.ini_options]
markers = [
    "emulator: integration tests that exercise the local Azure Cosmos DB Emulator (auto-skip when it is unreachable)",
    "sqlserver_integration: integration tests that apply and query the SAP emulator on SQL Server or Azure SQL",
]
